name: Security audit

# Separate from CI so a newly published advisory does not block unrelated PRs;
# the weekly run surfaces it instead.
on:
  push:
    branches: [main, develop, release]
    paths: ["Cargo.lock", "Cargo.toml", ".github/workflows/audit.yml"]
  pull_request:
    paths: ["Cargo.lock", "Cargo.toml", ".github/workflows/audit.yml"]
  schedule:
    - cron: "0 1 * * 1" # Monday 08:00 Vietnam time
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cargo-audit:
    name: cargo audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit
