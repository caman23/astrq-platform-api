name: Image

# Build the runtime image (backend + dashboard release pinned in ui.version), push it to
# GHCR, then deploy that exact image on Render through its deploy hook.
#
# Repository settings needed:
#   variable UI_REPO                (optional) owner/name of the UI repo,
#                                   default <this owner>/astrq-platform-ui
#   secret   UI_REPO_TOKEN          (only if the UI repo is private) token with read access
#   secret   RENDER_DEPLOY_HOOK_URL Render service → Settings → Deploy Hook
#                                   (unset = build and push only, no deploy)
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    name: Build, push, deploy
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - name: Fetch dashboard release
        env:
          GH_TOKEN: ${{ secrets.UI_REPO_TOKEN || github.token }}
          UI_REPO: ${{ vars.UI_REPO || format('{0}/astrq-platform-ui', github.repository_owner) }}
        run: |
          version="$(tr -d '[:space:]' < ui.version)"
          mkdir -p ui-dist
          gh release download "$version" --repo "$UI_REPO" --pattern ui-dist.tar.gz --output - \
            | tar -xz -C ui-dist
          test -f ui-dist/index.html
          echo "Dashboard $version from $UI_REPO"

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/astrq-platform-api
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}

      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy on Render
        if: github.ref == 'refs/heads/main'
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/astrq-platform-api:sha-${{ github.sha }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::notice::RENDER_DEPLOY_HOOK_URL not set — image pushed, not deployed"
            exit 0
          fi
          image="$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')"
          # the hook URL already carries ?key=…; imgURL picks the exact image to run
          curl -fsS -X POST -G "$HOOK" --data-urlencode "imgURL=$image" -o /dev/null
          echo "Render deploy triggered: $image"
